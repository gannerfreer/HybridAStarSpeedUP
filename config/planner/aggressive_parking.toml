# 窄空间泊车场景：更细的离散化、更频繁的 Reeds-Shepp 解析尝试。
schema_version = 1

[search]
xy_resolution_m = 0.4
heading_bins = 96
motion_step_m = 0.8
steering_samples = 7
allow_reverse = true
backward_search_range_m = 0.0
linear_preferred_distance_m2 = 4.0
goal_capture_radius_m = 6.0

[cost]
forward_cost = 1.0
reverse_cost = 1.5
turn_penalty = 0.8
switch_cost = 1.2

[analytic_expansion]
ratio = 2
shot_distance_m = 12.0
max_length_m = 20.0
min_connector_segment_m = 0.1

[budget]
default_time_budget_s = 3.0
default_node_budget = 500_000
